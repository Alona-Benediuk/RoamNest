services:
  backend:
    image: 847835841884.dkr.ecr.eu-north-1.amazonaws.com/roamnest-backend:latest
    build:
      context: ./backend
    container_name: roamnest-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    image: 847835841884.dkr.ecr.eu-north-1.amazonaws.com/roamnest-frontend:latest
    build:
      context: ./frontend/roamnest-frontend
      args:
        VITE_API_URL: ""
    container_name: roamnest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: roamnest-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: roamnest-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: roamnest-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data:
