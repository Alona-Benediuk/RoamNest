name: RoamNest CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Linting and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: roamnest_db
          POSTGRES_USER: ${{ secrets.DB_USER || 'runner_test_user' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'runner_test_pass' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt || true; fi

      - name: Lint with Flake8
        run: |
          # Предупреждения flake8 выводятся в лог, но не ломают пайплайн на этапе ранней разработки
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests
        env:
          POSTGRES_DB: roamnest_db
          POSTGRES_USER: ${{ secrets.DB_USER || 'runner_test_user' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'runner_test_pass' }}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py test || echo "Тесты еще в разработке"

  frontend-ci:
    name: Frontend Lint & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
            npm run build || echo "Фронтенд еще в разработке"
          else
            echo "Каталог frontend порожній або без package.json"
          fi

  docker-build-test:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t roamnest-backend:test ./backend
