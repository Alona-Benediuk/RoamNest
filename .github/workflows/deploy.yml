name: Deploy

on:
  push:
    branches:
      - main
      - feature/ecr-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend Docker image
        run: |
          docker build -t roamnest-backend ./backend
          docker tag roamnest-backend:latest ${{ steps.login-ecr.outputs.registry }}/roamnest-backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/roamnest-backend:latest

      - name: Build and push frontend Docker image
        run: |
          docker build --build-arg VITE_API_URL="" -t roamnest-frontend ./frontend/roamnest-frontend
          docker tag roamnest-frontend:latest ${{ steps.login-ecr.outputs.registry }}/roamnest-frontend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/roamnest-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            cd ~/RoamNest
            docker compose pull
            docker compose up -d
